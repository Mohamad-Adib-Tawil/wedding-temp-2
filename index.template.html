<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#211914">
    <meta name="description" content="%PAGE_DESCRIPTION%">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:title" content="%PAGE_TITLE%">
    <meta property="og:description" content="%PAGE_DESCRIPTION%">
    <meta property="og:url" content="%SITE_URL%">
    <meta property="og:image" content="%SOCIAL_IMAGE_URL%">
    <meta property="og:image:width" content="1733">
    <meta property="og:image:height" content="907">
    <meta name="twitter:card" content="summary_large_image">
    <title>%PAGE_TITLE%</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/Amiri-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="src/style.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body class="is-locked">
    <div id="experience" class="experience" data-stage="cover">
      <div class="cover-scene" aria-hidden="true">
        <div class="arch">
          <div class="arch-glow"></div>
          <div class="door door--right"></div>
          <div class="door door--left"></div>
          <div class="door-knob door-knob--right"></div>
          <div class="door-knob door-knob--left"></div>
        </div>
        <img class="cover-bride" src="new_assets/cover-bride.webp" alt="">
      </div>
      <div class="hall-scene" aria-hidden="true">
        <div class="hall-glow"></div>
        <div class="curtain curtain--right"></div>
        <div class="curtain curtain--left"></div>
        <img class="chandelier chandelier--main" src="assets/chandelier.svg" alt="">
        <img class="chandelier chandelier--small chandelier--right" src="assets/chandelier.svg" alt="">
        <img class="chandelier chandelier--small chandelier--left" src="assets/chandelier.svg" alt="">
        <div class="hall-floor"></div>
        <div class="sparkles"></div>
      </div>
      <div class="opening-flash" aria-hidden="true"></div>
      <div class="cover-content">
        <p class="cover-eyebrow" data-copy="occasion"></p>
        <div class="cover-ornament" aria-hidden="true">✦</div>
        <p class="cover-names"><span data-name="groomDisplay"></span><i>&amp;</i><span data-name="brideDisplay"></span></p>
        <p class="cover-hint" data-copy="doorHint"></p>
        <button id="open-invitation" class="cover-open" type="button" data-copy="open"></button>
      </div>
      <div id="hall-content" class="hall-content" aria-live="polite" hidden>
        <p class="hall-kicker reveal reveal--one" data-copy="heroKicker"></p>
        <div class="small-star reveal reveal--one" aria-hidden="true">✦</div>
        <h1 class="hall-names reveal reveal--two"><span data-name="groomDisplay"></span><span class="amp">&amp;</span><span data-name="brideDisplay"></span></h1>
        <p class="hall-line reveal reveal--three" data-copy="heroLine"></p>
        <button id="continue-to-site" class="hall-continue reveal reveal--three" type="button" data-copy="continue"></button>
      </div>
      <button id="skip-intro" class="skip-intro" type="button" data-copy="skip" hidden></button>
    </div>

    <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" hidden></button>
    <audio id="background-music" loop preload="none"></audio>

    <main id="wedding-content" inert aria-hidden="true">
      <section class="intro-section" id="home" tabindex="-1">
        <div class="section-rule" aria-hidden="true">✦</div>
        <p class="intro-bismillah" data-copy="bismillah"></p>
        <p class="overline" data-copy="occasion"></p>
        <h2 class="intro-names"><span data-name="groom"></span><span aria-hidden="true">&amp;</span><span data-name="bride"></span></h2>
        <p class="intro-message" data-copy="invitationMessage"></p>
      </section>

      <section class="letter-section" aria-labelledby="invitation-title">
        <div class="letter-card">
          <span class="letter-star" aria-hidden="true">✦</span>
          <h2 id="invitation-title" data-copy="invitationTitle"></h2>
          <p data-copy="invitationMessage"></p>
          <span class="letter-star" aria-hidden="true">✦</span>
        </div>
      </section>

      <section id="countdown-section" class="detail-section" aria-labelledby="countdown-title" hidden>
        <h2 id="countdown-title" data-copy="countdownTitle"></h2>
        <div id="countdown" class="countdown" aria-live="off"></div>
        <p id="countdown-complete" data-copy="countdownComplete" hidden></p>
      </section>

      <section id="program-section" class="detail-section" aria-labelledby="program-title" hidden>
        <h2 id="program-title" data-copy="programTitle"></h2>
        <ol id="program-list" class="program-list"></ol>
      </section>

      <section id="venue-section" class="detail-section" aria-labelledby="venue-title" hidden>
        <h2 id="venue-title" data-copy="venueTitle"></h2>
        <p id="venue-name" class="venue-name"></p>
        <p id="venue-address"></p>
        <a id="map-link" class="gold-link" target="_blank" rel="noopener noreferrer" data-copy="map" hidden></a>
      </section>

      <section id="notes-section" class="detail-section" aria-labelledby="notes-title" hidden>
        <h2 id="notes-title" data-copy="notesTitle"></h2>
        <ul id="notes-list"></ul>
      </section>

      <section id="calendar-section" class="detail-section calendar-section" aria-labelledby="calendar-title" hidden>
        <h2 id="calendar-title" data-copy="calendarTitle"></h2>
        <p id="event-date" class="event-date"></p>
        <p id="event-time"></p>
        <div class="button-row">
          <a id="google-calendar" class="gold-link" target="_blank" rel="noopener noreferrer" data-copy="calendarGoogle"></a>
          <button id="ics-calendar" class="outline-button" type="button" data-copy="calendarIcs"></button>
        </div>
      </section>

      <section id="rsvp-section" class="detail-section rsvp-section" aria-labelledby="rsvp-title" hidden>
        <h2 id="rsvp-title" data-copy="rsvpTitle"></h2>
        <p id="rsvp-description" data-copy="rsvpDescription"></p>
        <p id="rsvp-deadline" hidden></p>
        <a id="rsvp-link" class="gold-link" target="_blank" rel="noopener noreferrer" data-copy="rsvpButton"></a>
      </section>

      <footer class="footer">
        <span class="footer-star" aria-hidden="true">✦</span>
        <p data-copy="closing"></p>
        <p class="footer-names"><span data-name="groom"></span> <span aria-hidden="true">&amp;</span> <span data-name="bride"></span></p>
        <div class="footer-actions">
          <button id="share-button" type="button" data-copy="share"></button>
          <button id="copy-link" type="button" data-copy="copyLink"></button>
          <button id="replay-invitation" type="button" data-copy="replay"></button>
        </div>
      </footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
